<mat-card class="event-card" [attr.aria-label]="'Event summary for ' + event.name">
  <mat-card-header>
    <mat-card-title>{{ event.name }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p class="event-description">{{ event.description }}</p>
  </mat-card-content>

  <mat-card-footer class="event-footer">
    <div class="stat-item" role="status">
      <mat-icon aria-hidden="true">people</mat-icon>
      <span class="stat-label">{{ 'home.checkedInAttendees' | translate }}</span>
      <span class="stat-value">{{ checkedInCount }}</span>
    </div>
    <div class="stat-divider" aria-hidden="true"></div>
    <div class="stat-item" role="status">
      <mat-icon aria-hidden="true">star</mat-icon>
      <span class="stat-label">{{ 'home.averageRating' | translate }}</span>
      <span class="stat-value" *ngIf="averageRating !== null">{{ averageRating }}</span>
      <span class="stat-value no-ratings" *ngIf="averageRating === null">{{ 'home.noRatings' | translate }}</span>
    </div>
  </mat-card-footer>
</mat-card>
