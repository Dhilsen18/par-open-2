<div class="not-found-container" role="main" aria-labelledby="not-found-heading">
  <div class="not-found-card">
    <div class="error-code" aria-hidden="true">404</div>
    <mat-icon class="not-found-icon" aria-hidden="true">search_off</mat-icon>
    <h1 id="not-found-heading" class="not-found-heading">
      {{ 'notFound.message' | translate }}
      <code class="route-highlight">{{ currentPath }}</code>
      {{ 'notFound.notFoundText' | translate }}.
    </h1>
    <a
      mat-raised-button
      color="primary"
      routerLink="/home"
      class="back-btn"
      aria-label="Go back to Home page"
    >
      <mat-icon aria-hidden="true">home</mat-icon>
      {{ 'notFound.backHome' | translate }}
    </a>
  </div>
</div>
